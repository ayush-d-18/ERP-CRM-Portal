services:
  - type: web
    name: erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://frontend-erp-cpd3.onrender.com

  - type: static_site
    name: erp-frontend
    buildCommand: cd /opt/render/project && npm install && npm run build
    publishPath: /opt/render/project/dist
    envVars:
      - key: VITE_API_URL
        value: https://backend-erp-p8ct.onrender.com/api
